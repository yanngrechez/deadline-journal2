media:
  input: media
  output: /media
  rename: safe
  categories: [image]

content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: json
    filename:
      template: "{fields.slug}.json"
      field: false
    view:
      primary: title
      fields: [title, status, region, country, published_at]
      sort: [published_at, title]
      search: [title, author, country, region]
      default:
        sort: published_at
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        description: "Lowercase words separated by hyphens, e.g. spain-housing-crisis"
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use lowercase letters, numbers and hyphens only."
      - name: dek
        label: Subtitle / deck
        type: text
        required: true
      - name: author
        label: Author
        type: string
        required: true
      - name: country
        label: Country or actor
        type: string
        required: true
        description: "Use a country name, or an institution or organization name for Actors articles."
      - name: region
        label: Region
        type: select
        required: true
        options:
          values:
            - Europe
            - Americas
            - Middle East & North Africa
            - Sub-Saharan Africa
            - Asia-Pacific
            - Actors
      - name: topics
        label: Subjects
        type: select
        required: true
        options:
          multiple: true
          min: 1
          max: 4
          values:
            - name: politics
              label: Politics
            - name: economics
              label: Economics
            - name: history
              label: History
            - name: philosophy
              label: Philosophy
      - name: hero_image
        label: Hero image
        type: image
        required: true
      - name: hero_alt
        label: Hero image description for screen readers
        type: string
        description: "Describe what the photo shows. Captions are used as a fallback when this is blank."
      - name: hero_caption
        label: Hero image caption
        type: text
        description: "Briefly explain what the image shows. This appears directly beneath the image."
      - name: hero_credit
        label: Hero image credit / source
        type: string
        description: "Photographer, publication, archive, or source citation."
      - name: published_at
        label: Publication date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: updated_at
        label: Last significant update (optional)
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
        description: "Set only when you substantially revise the published article. Used for search metadata and the sitemap; leave blank on first publication. Do not use a future date."
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: Draft
            - name: published
              label: Published
      - name: is_placeholder
        label: Template placeholder
        type: boolean
        default: false
        description: "Turn this on for demonstration articles. Placeholder stories stay visible but do not count toward country coverage."
      - name: body
        label: Article body
        type: rich-text
        required: true
        options:
          format: html
          media: false
          switcher: true
      - name: sections
        label: Additional article sections
        type: block
        list: true
        blockKey: type
        description: "Continue the article with text and images in reading order. To place a photo midway through a story, keep the opening in Article body, add an Image section, then put the following paragraphs in a Text section. Reorder sections to move them."
        blocks:
          - name: text
            label: Text
            fields:
              - name: body
                label: Paragraphs
                type: rich-text
                required: true
                options:
                  format: html
                  media: false
                  switcher: true
          - name: image
            label: Image
            fields:
              - name: image
                label: Image
                type: image
                required: true
              - name: alt
                label: Image description for screen readers
                type: string
                required: true
                description: "Briefly describe the image for readers who cannot see it."
              - name: caption
                label: Caption
                type: text
                description: "Explain what the image shows. Displayed in small grey text below the image."
              - name: credit
                label: Photo credit / source
                type: string
                description: "Photographer, agency, archive, or other source."

      - name: sources
        label: Sources
        type: rich-text
        description: "Paste your already-formatted references here (for example, APSA citations). Italics, links, paragraphs, and lists are preserved. Shown under an expandable SOURCES button after the article. Leave empty to hide the button."
        options:
          format: html
          media: false
          switcher: true

  - name: front-cover
    label: Front cover
    type: file
    path: content/front-cover.json
    format: json
    fields:
      - name: main-story
        label: Main story
        type: reference
        description: "Choose a published article. Leave empty to hide this slot; nothing is promoted automatically. Select each article only once."
        options:
          collection: articles
          multiple: false
          search: "title,slug,author"
          value: "{fields.slug}"
          label: "{fields.title} ({fields.status})"
      - name: bottom-story
        label: Bottom story
        type: reference
        description: "Choose a published article. Leave empty to hide this slot; nothing is promoted automatically. Select each article only once."
        options:
          collection: articles
          multiple: false
          search: "title,slug,author"
          value: "{fields.slug}"
          label: "{fields.title} ({fields.status})"
      - name: side-story-up
        label: Side story up
        type: reference
        description: "Choose a published article. Leave empty to hide this slot; nothing is promoted automatically. Select each article only once."
        options:
          collection: articles
          multiple: false
          search: "title,slug,author"
          value: "{fields.slug}"
          label: "{fields.title} ({fields.status})"
      - name: side-story-down
        label: Side story down
        type: reference
        description: "Choose a published article. Leave empty to hide this slot; nothing is promoted automatically. Select each article only once."
        options:
          collection: articles
          multiple: false
          search: "title,slug,author"
          value: "{fields.slug}"
          label: "{fields.title} ({fields.status})"
      - name: side-story-right
        label: Side story right
        type: reference
        description: "Choose a published article. Leave empty to hide this slot; nothing is promoted automatically. Select each article only once."
        options:
          collection: articles
          multiple: false
          search: "title,slug,author"
          value: "{fields.slug}"
          label: "{fields.title} ({fields.status})"

  - name: email-announcements
    label: Publication announcements (RSS)
    type: collection
    path: content/announcements
    format: json
    filename:
      template: "{fields.slug}.json"
      field: false
    view:
      primary: title
      fields: [title, kind, status, published_at]
    fields:
      - name: title
        label: Announcement headline
        type: string
        required: true
      - name: slug
        label: Permanent announcement ID
        type: string
        required: true
        description: "Use lowercase words separated by hyphens. Keep this unchanged after publication to avoid sending the same announcement again."
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "Use lowercase words separated by hyphens."
      - name: kind
        label: Type
        type: select
        options:
          values: [edition, announcement]
        required: true
        default: announcement
      - name: message
        label: Message
        type: text
        required: true
        description: "Write the announcement. Use blank lines between paragraphs. This text becomes public in the RSS feed; send newsletters separately in Buttondown."
      - name: link
        label: Read more link
        type: string
        default: /
        description: "A Deadline Journal path, such as / or /europe."
      - name: published_at
        label: Publication time (UTC)
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
        description: "Use the current time when publishing to the RSS feed. Future dates need a site rebuild when due."
      - name: status
        label: Status
        type: select
        options:
          values: [draft, published]
        default: draft
        required: true
        description: "Published adds this message to the public RSS feed only. The free setup does not email it; compose and send newsletters in Buttondown."

  - name: newsletter-settings
    label: Email signup settings
    type: file
    path: content/newsletter.json
    fields:
      - name: buttondown_username
        label: Buttondown newsletter username
        type: string
        description: "The username from your free Buttondown account, not an email address or API key."
      - name: delivery_verified
        label: Signup confirmation and email delivery tested
        type: boolean
        default: false
      - name: enabled
        label: Show the email signup bell
        type: boolean
        default: false
        description: "Enable only after connecting the email provider and testing the complete signup and delivery flow."

settings:
  commit:
    identity: user
    templates:
      create: "Publish content: {path}"
      update: "Update content: {path}"
      delete: "Remove content: {path}"
